<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App Mael - Día 16 Completado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            transition: background 0.3s;
        }

       .dark-mode {
            background: #1a1a1a;
            color: white;
        }

        #tareaInput {
            padding: 10px;
            width: 250px;
            margin: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        #filtros {
            margin: 15px 0;
        }

        #filtros button {
            padding: 8px 15px;
            margin: 0 5px;
            border: 1px solid #ccc;
            background: white;
            color: black;
        }

       .filtro-activo {
            background: #4CAF50!important;
            color: white!important;
            border: 1px solid #4CAF50!important;
        }

       .dark-mode #filtros button {
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #e0e0e0;
            padding: 10px;
            margin: 5px auto;
            width: 350px;
            border-radius: 5px;
            text-align: left;
            cursor: pointer;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

       .dark-mode li {
            background: #333;
        }

       .completada {
            text-decoration: line-through;
            opacity: 0.6;
            background: #c8e6c9;
        }

       .dark-mode.completada {
            background: #2e7d32;
        }

       .btn-borrar {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 12px;
        }

       .btn-borrar:hover {
            background: #cc0000;
        }

        .texto-tarea {
            cursor: text;
            flex-grow: 1;
            margin: 0 10px;
        }

        .input-editar {
            width: 90%;
            padding: 2px 5px;
            border: 1px solid #4CAF50;
            border-radius: 3px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .dark-mode .input-editar {
            background: #333;
            color: white;
        }

        #contador {
            margin: 10px 0;
            font-weight: bold;
            font-size: 14px;
        }

        .handle {
            cursor: grab;
            margin-right: 8px;
            opacity: 0.5;
        }

        .handle:active {
            cursor: grabbing;
        }

        .fecha-tarea {
            font-size: 11px;
            opacity: 0.6;
            margin-right: 10px;
        }

        li.arrastrando {
            opacity: 0.4;
            background: #ffeb3b;
        }

        .dark-mode li.arrastrando {
            background: #f9a825;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Mi Primera Web Pro</h1>

    <input type="text" id="tareaInput" placeholder="Escribe una tarea...">
    <button onclick="agregarTarea()">Agregar Tarea</button>
    <button onclick="cambiarTema()">🌙 Tema</button>
    <button onclick="resetearTodo()">Resetear Todo</button>
    <div id="contador">Cargando...</div>

    <div id="filtros">
        <button id="filtroTodas" class="filtro-activo" onclick="cambiarFiltro('todas')">Todas</button>
        <button id="filtroPendientes" onclick="cambiarFiltro('pendientes')">Pendientes</button>
        <button id="filtroCompletadas" onclick="cambiarFiltro('completadas')">Completadas</button>
    </div>

    <ul id="listaTareas"></ul>

    <script>
        let tareas = JSON.parse(localStorage.getItem("tareas")) || [];
        let filtroActual = "todas";
     
        window.onload = function() {
            mostrarTareas();
            cargarTema();
        }
     
        function agregarTarea() {
            let input = document.getElementById("tareaInput");
            let texto = input.value.trim();

            if (texto === "") {
                alert("Escribe una tarea primero");
                return;
            }

            let fecha = new Date().toLocaleDateString('es-MX');
            tareas.push({
                texto: texto,
                hecha: false,
                fecha: fecha
            });

            localStorage.setItem("tareas", JSON.stringify(tareas));
            input.value = "";
            mostrarTareas();
        }
        
        function mostrarTareas() {
            let lista = document.getElementById("listaTareas");
            lista.innerHTML = "";

            actualizarContador();

            let tareasFiltradas = tareas;
            if (filtroActual === "pendientes") {
                tareasFiltradas = tareas.filter(tarea => !tarea.hecha);
            } else if (filtroActual === "completadas") {
                tareasFiltradas = tareas.filter(tarea => tarea.hecha);
            }

            for (let i = 0; i < tareasFiltradas.length; i++) {
                let indexOriginal = tareas.indexOf(tareasFiltradas[i]);
                let clase = tareasFiltradas[i].hecha ? "completada" : "";
                let icono = tareasFiltradas[i].hecha ? "☑" : "☐";
                let fecha = tareasFiltradas[i].fecha || "Sin fecha";

                lista.innerHTML += `
                    <li class="${clase}" draggable="true" data-index="${indexOriginal}">
                        <span class="handle">☰</span>
                        <span onclick="toggleTarea(${indexOriginal})">${icono}</span>
                        <span class="texto-tarea" ondblclick="editarTarea(this, ${indexOriginal})">${tareasFiltradas[i].texto}</span>
                        <span class="fecha-tarea">[${fecha}]</span>
                        <button class="btn-borrar" onclick="borrarTarea(event, ${indexOriginal})">🗑️</button>
                    </li>`;
            }

            actualizarBotonesFiltro();
            activarDragAndDrop();
        }

        function actualizarContador() {
            let completadas = tareas.filter(t => t.hecha).length;
            let total = tareas.length;
            document.getElementById("contador").innerHTML = `Tareas completadas: ${completadas}/${total}`;
        }

        function toggleTarea(index) {
            tareas[index].hecha = !tareas[index].hecha;
            localStorage.setItem("tareas", JSON.stringify(tareas));
            mostrarTareas();
        }

        function borrarTarea(event, index) {
            event.stopPropagation();
            tareas.splice(index, 1);
            localStorage.setItem("tareas", JSON.stringify(tareas));
            mostrarTareas();
        }

        function editarTarea(elemento, index) {
            if (elemento.querySelector('input')) return;

            let textoActual = tareas[index].texto;
            elemento.innerHTML = `<input type="text" class="input-editar" value="${textoActual}">`;

            let input = elemento.querySelector('input');
            input.focus();
            input.select();

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') guardarEdicion(index, input.value);
                if (e.key === 'Escape') mostrarTareas();
            });

            input.addEventListener('blur', function() {
                guardarEdicion(index, input.value);
            });
        }

        function guardarEdicion(index, nuevoTexto) {
            let texto = nuevoTexto.trim();
            if (texto !== "") {
                tareas[index].texto = texto;
                localStorage.setItem("tareas", JSON.stringify(tareas));
            }
            mostrarTareas(); 
        }

        function cambiarFiltro(nuevoFiltro) {
            filtroActual = nuevoFiltro;
            mostrarTareas();
        }

        function actualizarBotonesFiltro() {
            document.getElementById("filtroTodas").className = filtroActual === 'todas' ? 'filtro-activo' : '';
            document.getElementById("filtroPendientes").className = filtroActual === 'pendientes' ? 'filtro-activo' : '';
            document.getElementById("filtroCompletadas").className = filtroActual === 'completadas' ? 'filtro-activo' : '';
        }

        function cambiarTema() {
            document.body.classList.toggle("dark-mode");
            let esDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("tema", esDark ? "dark" : "light");
        }

        function cargarTema() {
            if (localStorage.getItem("tema") === "dark") {
                document.body.classList.add("dark-mode");
            }
        }

        function resetearTodo() {
            if(confirm("¿Seguro que quieres borrar todas tus tareas?")) {
                tareas = [];
                localStorage.setItem("tareas", JSON.stringify(tareas));
                mostrarTareas();
            }
        }

        // --- SISTEMA DRAG & DROP COMPLETADO ---
        function activarDragAndDrop() {
            let items = document.querySelectorAll('#listaTareas li');
            let lista = document.getElementById("listaTareas");

            items.forEach(item => {
                item.addEventListener('dragstart', function() {
                    setTimeout(() => item.classList.add('arrastrando'), 0);
